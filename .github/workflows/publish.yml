name: publish

# Publishing is always a deliberate act: a tag, or a button. NOT on push to
# main — the mirror is regenerated and force-pushed on every sync, and a
# publish-on-push would fire on syncs that changed no version at all.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      # At JOB level, not step level: a step's own env: block is not visible to
      # that step's own if: condition, so the bootstrap guard below would have
      # been permanently false and the token never written.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      # Required for npm provenance, and for trusted publishing once the
      # package exists and NPM_TOKEN can be deleted.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - run: npm install
      # Never publish a tree whose own tests do not pass. The validator in this
      # package is the same one the submission queue runs.
      - run: npm test

      # Skip rather than fail when the version is already on the registry, so a
      # re-run of a partially-failed release is harmless.
      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on the registry — nothing to do"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Auth is written ONLY when a token secret exists.
      #
      # This is what makes the token a one-time bootstrap rather than a
      # permanent fixture. npm's trusted publishing requires the package to
      # already exist, so the very first release needs a token — but every
      # release after it should use OIDC, which needs NO secret and therefore
      # never expires.
      #
      # The subtlety: actions/setup-node's registry-url option writes an
      # .npmrc containing _authToken=${NODE_AUTH_TOKEN}. With the secret deleted
      # that expands to an EMPTY token, and an empty credential is worse than
      # no credential — npm stops looking for the OIDC one and fails to
      # authenticate. So registry-url is not used, and .npmrc is written by
      # hand only when there is something to put in it.
      - name: Configure npm auth (bootstrap only)
        if: steps.check.outputs.published == 'false' && env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      # The failure reason is echoed as an ANNOTATION, not just into the log.
      # Reading a run's log needs repo auth; annotations do not. When the person
      # debugging a failed release is not the person holding the token, "exit
      # code 1" is all they get — which is exactly how the first two attempts
      # here were diagnosed by guesswork.
      - name: Publish
        if: steps.check.outputs.published == 'false'
        # --provenance ties the tarball to this workflow run and this commit.
        # --access public is required for a scoped name and harmless otherwise.
        run: |
          set +e
          npm publish --provenance --access public > publish.log 2>&1
          code=$?
          cat publish.log
          if [ "$code" -ne 0 ]; then
            grep -iE 'npm (error|ERR)' publish.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          rm -f publish.log
          exit "$code"
